[workspace]
resolver = "2"
members = [
    "projects/engine/*",
    "projects/bindings/*",
]
default-members = [
    "projects/bindings/rgss-napi",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "Apache-2.0"
readme = "readme.md"

[workspace.dependencies]
rgss-types = { path = "projects/engine/rgss-types" }
rgss-core = { path = "projects/engine/rgss-core" }
rgss-game = { path = "projects/engine/rgss-game" }
rgss-napi = { path = "projects/bindings/rgss-napi" }
rgss-wasm = { path = "projects/bindings/rgss-wasm" }
encoding_rs = "0.8"
flate2 = "1"
image = { version = "0.25", default-features = true }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
# Spark：脚本链路。本机 path 覆盖放在已 gitignore 的 `.cargo/config.toml`。
spark-script-ruby = { git = "https://github.com/game-gpt/SparkleEngine.git", branch = "dev" }
spark-vm = { git = "https://github.com/game-gpt/SparkleEngine.git", branch = "dev" }
spark-gc = { git = "https://github.com/game-gpt/SparkleEngine.git", branch = "dev" }
spark-core = { git = "https://github.com/game-gpt/SparkleEngine.git", branch = "dev" }
spark-engine = { git = "https://github.com/game-gpt/SparkleEngine.git", branch = "dev" }
spark-renderer = { git = "https://github.com/game-gpt/SparkleEngine.git", branch = "dev" }
spark-audio = { git = "https://github.com/game-gpt/SparkleEngine.git", branch = "dev" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
